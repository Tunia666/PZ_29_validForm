<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Учебная форма авторизации NOVA SPACE" />
    <title>ПЗ 29 — NOVA SPACE</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg xml" />
    <link rel="stylesheet" href="./styles/style.css" />
    <script src="./scripts/app.js" defer></script>
  </head>
  <body>
    <div class="page">
      <main class="auth">
        <div class="auth__top">
          <div class="brand brand--mobile">
            <span class="brand__mark">N</span><span>NOVA SPACE</span>
          </div>
        </div>

        <section class="auth-card">
          <h2>С возвращением!</h2>

          <form id="login-form" class="auth-form" novalidate>
            <div class="field">
              <label class="field__label" for="email">Электронная почта</label>
              <input
                class="field__input"
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
              />
              <p class="field__error" id="email-error"></p>
            </div>

            <div class="field">
              <label class="field__label" for="password">Пароль</label>
              <input
                class="field__input"
                type="password"
                id="password"
                name="password"
                placeholder="Минимум 8 символов"
                required
                minlength="8"
              />
              <p class="field__error" id="password-error"></p>
            </div>

            <button class="submit-button" type="submit">Войти в аккаунт</button>
            <p class="form-status" id="form-status"></p>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
