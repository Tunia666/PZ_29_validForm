<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Учебная форма авторизации NOVA SPACE" />
    <title>ПЗ 29 — NOVA SPACE</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles/style.css" />
    <script src="./scripts/app.js" defer></script>
  </head>
  <body>
    <div class="page">
      <main class="auth">
        <div class="auth__top">
          <div class="brand brand--mobile">
            <span class="brand__mark">N</span><span>NOVA SPACE</span>
          </div>
        </div>
        <!-- ЗАДАНИЕ 1: удалите эту заглушку и САМИ создайте форму по Figma.
           Используйте готовые CSS-классы из styles/style.css.
           Требуемые id: login-form, email, password, email-error,
           password-error, form-status.
           Нужны label, input[type=email], input[type=password],
           button[type=submit], два блока ошибок и блок результата. -->
        <section class="auth-card">
          <div class="auth-card__mark">N</div>
          <h1 class="auth-card__title">С возвращением!</h1>
          <p class="auth-card__intro">Введите данные, чтобы продолжить обучение.</p>
          <form id="login-form" class="auth-form" novalidate>
            <div class="field">
            <label class="field__label" for="email">Электронная почта</label>
            <input
              placeholder="student@example.com"
              class="field__input"
              id="email"
              name="email"
              type="email"
              required
              aria-describedby="email-error"
              aria-invalid="false"/>
            <p class="field__error" id="email-error"></p>
          </div>
          <div class="field">
            <label class="field__label" for="password">Пароль</label>
            <input
              class="field__input"
              id="password"
              placeholder="Не менее 8 символов"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              minlength="8"/>            
            <p class="field__hint">Не менее 8 символов, включая букву и цифру.</p>
            <p class="field__error" id="password-error"></p>
          </div>
           <label class="remember">
            <input type="checkbox" id="remember" name="remember" />Запомнить меня
          </label>
          <button type="submit" class="submit-button">Войти в аккаунт <span aria-hidden="true">→</span></button> 
          <p id="form-status" role="status"></p>
          </form>
          

        </section>
      </main>
    </div>
  </body>
</html>
